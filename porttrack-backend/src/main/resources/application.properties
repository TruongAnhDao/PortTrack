spring.application.name=porttrack

# Database credentials must be supplied through environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/port_track?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:porttrack}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The schema is managed manually with CREATE_TABLE.TXT and migration scripts.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8081}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION_MS:86400000}
app.frontend.origins=${FRONTEND_ORIGINS:http://localhost:5173}
app.entrade.base-url=${ENTRADE_API_URL:https://services.entrade.com.vn/chart-api/v2/ohlcs/stock}
